name: Fork CI
# Tests of the fork, a trimmed down version of test.yml that runs on GitHub-hosted runners only.

on:
  push:
    branches: ['fork/**']
  pull_request:
    branches: ['fork/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test'
        type: string
        required: false

concurrency:
  group: fork-ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions: {}

jobs:
  server-unit-tests:
    name: Server unit tests & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-unit
        run: mise run //server:ci-unit

  server-medium-tests:
    name: Server medium tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-medium
        run: mise run ci-medium

  web-unit-tests:
    name: Web unit tests & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Run ci-unit
        run: mise run ci-unit

      - name: Run linter
        run: pnpm lint
        if: ${{ !cancelled() }}

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3@sha256:dbf18b3ffea4a81434c65b71e20d27203baf903a0275f4341e4c16dfd901fd67
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: immich
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Generate OpenAPI spec and clients
        run: mise //:open-api

      - name: Run migrations
        run: pnpm --filter immich migrations:run

      - name: Generate SQL queries
        run: mise //:sql
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/immich

      - name: Verify nothing changed
        run: |
          if ! git diff --exit-code -- open-api/immich-openapi-specs.json packages/sdk/src server/src/queries; then
            echo "::error::Generated files are not up to date, run 'mise //:open-api' and 'mise //:sql' and commit the result"
            exit 1
          fi

  e2e-tests-server:
    name: End-to-end tests (server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup packages
        run: pnpm --filter @immich/sdk --filter @immich/cli install --frozen-lockfile && pnpm --filter @immich/sdk --filter @immich/cli build

      - name: Setup web
        run: pnpm install --frozen-lockfile && pnpm exec svelte-kit sync
        working-directory: ./web

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Docker Compose
        id: docker
        run: docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300

      - name: Run e2e tests (api & cli)
        env:
          VITEST_DISABLE_DOCKER_SETUP: true
        run: pnpm test
        if: ${{ !cancelled() && steps.docker.outcome == 'success' }}

      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt

      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-server-docker-logs
          path: e2e/docker-compose-logs.txt
